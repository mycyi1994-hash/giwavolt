# Deploy GameVault to Giwa Sepolia, then verify it — from a button.
#
# Unlike verification, deploying SIGNS a transaction, so this one needs a key.
# It is read from the DEPLOY_PRIVATE_KEY repository secret and never appears in
# the repo or the logs (GitHub masks secret values in output).
#
# Use a THROWAWAY TESTNET wallet. The secret sits in a public repository's
# settings: only accounts with write access can start this workflow and forks
# cannot read it, but a key that is worth stealing does not belong here at all.
name: Deploy GameVault (Giwa Sepolia)

on:
  workflow_dispatch:
    inputs:
      testkrw:
        description: "tKRW token address the vault custodies"
        required: true
        default: "0x616cb26e3Af3895DEAc5A53f760ECEFaEF4e78bc"
      operator:
        description: "Operator address that signs withdrawal vouchers (blank = deployer)"
        required: false
        default: ""
      bankroll:
        description: "tKRW to seed the house bankroll (0 to skip; needs the deployer to hold that much)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        working-directory: contracts
        run: npm ci

      - name: Test
        working-directory: contracts
        run: npm test

      - name: Deploy
        working-directory: contracts
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          TESTKRW_ADDRESS: ${{ inputs.testkrw }}
          OPERATOR_ADDRESS: ${{ inputs.operator }}
          BANKROLL_TKRW: ${{ inputs.bankroll }}
        run: npm run deploy:vault

      - name: Verify on Blockscout
        working-directory: contracts
        env:
          TESTKRW_ADDRESS: ${{ inputs.testkrw }}
        run: npm run verify:vault

      - name: Summary
        if: always()
        run: |
          F=contracts/deployments/gameVault.giwaSepolia.json
          if [ -f "$F" ]; then
            ADDR=$(node -e "console.log(require('./$F').gameVault)")
            {
              echo "## GameVault deployed"
              echo ""
              echo "\`$ADDR\`"
              echo ""
              echo "https://sepolia-explorer.giwa.io/address/$ADDR"
              echo ""
              echo '```json'
              cat "$F"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deployment manifest — the deploy step did not get that far." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Addresses are public by construction and the whole point of tracking
      # deployments/ is that the repo says what is live. Failing to commit must
      # not read as a failed deploy, hence continue-on-error.
      - name: Record the address
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/deployments/gameVault.giwaSepolia.json
          git diff --cached --quiet || git commit -m "chore: record GameVault deployment on Giwa Sepolia"
          git push
