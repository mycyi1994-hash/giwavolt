# Publish contract source to the target chain's explorer, from a button in the
# browser.
#
# Verification uploads source — it does not sign anything — so this needs no
# private key. That is the whole reason it can live in CI: deploying would need
# a funded key, verifying does not. Blockscout (Giwa) needs nothing at all; the
# BscScan-family explorers want an API key, which is a read credential, not a
# signing one. Put it in the BSCSCAN_API_KEY repository secret.
#
# Run it from the Actions tab: "Verify contracts" → Run workflow.
name: Verify contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Chain to verify on"
        required: true
        default: "giwaSepolia"
        type: choice
        options: [giwaSepolia, bscTestnet, opbnbTestnet]
      testkrw:
        description: "TestKRW address (blank to skip)"
        required: false
        default: "0x616cb26e3Af3895DEAc5A53f760ECEFaEF4e78bc"
      vault:
        description: "GameVault address (blank to skip)"
        required: false
        default: ""
      operator:
        description: "GameVault operator address — required only when verifying a vault"
        required: false
        default: ""
      evm:
        description: "EVM version the contract was compiled for (paris | shanghai | cancun)"
        required: false
        default: "paris"
      optimizer:
        description: "Optimizer enabled at deploy time (true | false)"
        required: false
        default: "true"
      optimizer_runs:
        description: "Optimizer runs at deploy time"
        required: false
        default: "200"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        working-directory: contracts
        run: npm ci

      # Compile first so a source/bytecode mismatch shows up as a compile error
      # here rather than as an opaque rejection from the explorer.
      - name: Compile
        working-directory: contracts
        env:
          SOLC_EVM_VERSION: ${{ inputs.evm }}
          SOLC_OPTIMIZER: ${{ inputs.optimizer }}
          SOLC_OPTIMIZER_RUNS: ${{ inputs.optimizer_runs }}
        run: npm run compile

      - name: Verify TestKRW
        if: inputs.testkrw != ''
        working-directory: contracts
        env:
          NETWORK: ${{ inputs.network }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          TESTKRW_ADDRESS: ${{ inputs.testkrw }}
          SOLC_EVM_VERSION: ${{ inputs.evm }}
          SOLC_OPTIMIZER: ${{ inputs.optimizer }}
          SOLC_OPTIMIZER_RUNS: ${{ inputs.optimizer_runs }}
        run: npm run verify:testkrw

      - name: Verify GameVault
        if: inputs.vault != ''
        working-directory: contracts
        env:
          NETWORK: ${{ inputs.network }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          GAMEVAULT_ADDRESS: ${{ inputs.vault }}
          TESTKRW_ADDRESS: ${{ inputs.testkrw }}
          OPERATOR_ADDRESS: ${{ inputs.operator }}
          SOLC_EVM_VERSION: ${{ inputs.evm }}
          SOLC_OPTIMIZER: ${{ inputs.optimizer }}
          SOLC_OPTIMIZER_RUNS: ${{ inputs.optimizer_runs }}
        run: npm run verify:vault

      - name: Where to look
        if: always()
        env:
          NETWORK: ${{ inputs.network }}
        run: |
          case "$NETWORK" in
            bscTestnet)   BASE=https://testnet.bscscan.com ;;
            opbnbTestnet) BASE=https://testnet.opbnbscan.com ;;
            *)            BASE=https://sepolia-explorer.giwa.io ;;
          esac
          for addr in "${{ inputs.testkrw }}" "${{ inputs.vault }}"; do
            [ -n "$addr" ] && echo "Explorer: $BASE/address/$addr"
          done
          echo "Verified contracts show source and Read/Write tabs instead of raw bytecode."
